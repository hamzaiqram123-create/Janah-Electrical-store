<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>جناح الريادة</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#17202a;color:#f2f4f3;font:16px/1.6 "Segoe UI","IBM Plex Sans Arabic",Tahoma,sans-serif;text-align:center;padding:24px}
.stripe{position:fixed;inset:auto 0 0 0;height:5px;background:linear-gradient(90deg,#8a4b2a 0 20%,#17202a 20% 40%,#8f969c 40% 60%,#1d57b0 60% 80%,#2e8b57 80%)}
h1{margin:0;font-size:22px}p{margin:0;color:#b9c2ca;max-width:520px}
.bar{width:180px;height:3px;border-radius:2px;background:#2b3743;overflow:hidden}.bar i{display:block;width:40%;height:100%;background:#e39a5b;animation:m 1.1s ease-in-out infinite}
@keyframes m{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
a.btn{display:inline-block;margin-top:6px;background:#e39a5b;color:#17202a;font-weight:700;text-decoration:none;border-radius:6px;padding:11px 22px}
</style></head>
<body><svg viewBox="0 0 32 32" width="72" height="72" aria-hidden="true"><rect width="32" height="32" rx="5" fill="#e39a5b"/><path d="M18 4 8 18h7l-2 10 11-15h-7z" fill="#17202a"/></svg><h1>شركة جناح الريادة</h1><div class="bar"><i></i></div><div class="stripe"></div>
<script>
// go on to the store once this screen has painted; it stays visible until the store page is ready
const u = new URLSearchParams(location.search).get("u");
requestAnimationFrame(() => setTimeout(() => { if (u) location.replace(u); }, 50));
</script></body></html>
