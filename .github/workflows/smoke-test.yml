# Runs both debug APKs on an Android emulator and saves screenshots + logs.
name: Emulator smoke test
on:
  workflow_dispatch:
  push:
    branches: [ android-apps ]
    paths: [ '.github/workflows/smoke-test.yml', '.github/scripts/**' ]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get latest APKs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: mkdir -p out && gh release download -R "${{ github.repository }}" --pattern '*debug.apk' -D out && ls -la out
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 .github/scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-results, path: shots/ }
      - name: Publish screenshots to a 'smoke-test' release
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete smoke-test -R "${{ github.repository }}" -y --cleanup-tag || true
          gh release create smoke-test -R "${{ github.repository }}" --target android-apps --prerelease \
            --title "Emulator smoke test screenshots" --notes "Automatic test output" shots/*.png shots/*.txt
