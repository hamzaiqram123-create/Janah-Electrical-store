# Builds the Customer + Owner APKs (debug + release) on GitHub's servers
# and publishes them as a GitHub Release you can download on your phone.
name: Build APKs

on:
  push:
    branches: [ android-apps ]
    paths-ignore: [ '.github/workflows/smoke-test.yml', '.github/scripts/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (pre-installed on runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Same signing keys on every build, so new APKs install over old ones
      - name: Restore signing keys
        id: keys
        uses: actions/cache@v4
        with:
          path: |
            android/release.jks
            ~/.android/debug.keystore
          key: janah-signing-keys-v1

      - name: Release signing key
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-janahtest123}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          elif [ -f release.jks ]; then
            echo "Using cached signing key"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret: creating a TEST signing key (fine for testing, not for Play Store)"
            keytool -genkeypair -noprompt -keystore release.jks -alias janah -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Janah Al Riyadah, O=Janah Al Riyadah, C=SA"
          fi
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=janah\nkeyPassword=%s\n' "$PASS" "$PASS" > keystore.properties

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew --no-daemon assembleCustomerDebug assembleOwnerDebug assembleCustomerRelease assembleOwnerRelease

      - name: Collect APKs
        run: |
          keytool -list -v -keystore android/release.jks -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'janahtest123' }}" -alias janah | grep -E "SHA1:|SHA256:" | sed 's/^/RELEASE KEY /'
          mkdir -p out
          cp android/app/build/outputs/apk/customer/debug/app-customer-debug.apk     out/Janah-Customer-debug.apk
          cp android/app/build/outputs/apk/owner/debug/app-owner-debug.apk           out/Janah-Owner-debug.apk
          cp android/app/build/outputs/apk/customer/release/app-customer-release.apk out/Janah-Customer-release.apk
          cp android/app/build/outputs/apk/owner/release/app-owner-release.apk       out/Janah-Owner-release.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: janah-apks
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Janah apps — build ${{ github.run_number }}
          body: |
            Customer app + Owner app (debug and release APKs).
            Phone par .apk download karein → Install (Settings mein "Install unknown apps" allow karein).
          files: out/*.apk
