# Render Blueprint: creates the PostgreSQL database and the web service in one step.
# Render dashboard → New → Blueprint → pick this repository. You'll be asked for the values marked sync: false.
# Plans are "free" here; for a shop taking real orders change them to paid plans (free databases are deleted
# after 30 days and free services sleep after 15 idle minutes). See docs/DEPLOYMENT.md.
databases:
  - name: janah-store-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: janah
    user: janah
    ipAllowList: []          # reachable only from services in this Render workspace

services:
  - type: web
    name: janah-store
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: janah-store-db
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_DRIVER
        value: db              # product photos in PostgreSQL: Render's disk is wiped on every restart
      - key: SEED_ON_START
        value: "true"          # set to false after the first successful deploy
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false            # at least 10 characters with letters and digits; delete after the first deploy
      - key: LOG_LEVEL
        value: info
      # Add when ready (see .env.example): APP_URL for a custom domain, PAYMENT_PROVIDER + MOYASAR_SECRET_KEY,
      # EMAIL_PROVIDER + RESEND_API_KEY + EMAIL_FROM, SMS_PROVIDER …, ZATCA_* …
